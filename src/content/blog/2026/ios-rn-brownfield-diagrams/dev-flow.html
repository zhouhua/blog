<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日常开发</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f5f5;
        color: #2d3142;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 32px;
        font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .frame {
        width: 960px;
      }
      .eyebrow {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4f5d75;
        margin-bottom: 8px;
      }
      h1 {
        font-family: 'Instrument Serif', 'Noto Serif SC', 'PingFang SC', serif;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 24px;
      }
      svg {
        width: 960px;
        height: 636px;
        display: block;
      }
    </style>
  </head>

            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />

        <rect width="960" height="636" fill="#f5f5f5" />
        <line

</html>
