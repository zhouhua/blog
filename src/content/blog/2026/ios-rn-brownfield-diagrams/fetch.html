<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客户端取包</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f5f5;
        color: #2d3142;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 32px;
        font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .frame {
        width: 960px;
      }
      .eyebrow {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4f5d75;
        margin-bottom: 8px;
      }
      h1 {
        font-family: 'Instrument Serif', 'Noto Serif SC', 'PingFang SC', serif;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 24px;
      }
      svg {
        width: 960px;
        height: 336px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Architecture · Diagram Design</p>
      <h1>客户端取包</h1>
      <svg
        width="960"
        height="336"
        viewBox="0 0 960 336"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="fetch-title fetch-desc"
      >
        <title id="fetch-title">客户端取包</title>
        <desc id="fetch-desc">Client 同时向 Updates API 和 CDN 取数。两条箭头没有先后。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
          </marker>
        </defs>
        <rect width="960" height="336" fill="#f5f5f5" />
        <path
          d="M 200 168 H 360 Q 368 168 368 160 V 96 Q 368 88 376 88 H 480"
          fill="none"
          stroke="#2e5aa8"
          stroke-width="1.2"
          marker-end="url(#arrow-link)"
        />
        <path
          d="M 200 208 H 400 Q 408 208 408 216 V 240 Q 408 248 416 248 H 480"
          fill="none"
          stroke="#2e5aa8"
          stroke-width="1.2"
          marker-end="url(#arrow-link)"
        />
        <rect x="40" y="148" width="160" height="80" rx="6" fill="#f5f5f5" />
        <rect
          x="40"
          y="148"
          width="160"
          height="80"
          rx="6"
          fill="rgba(79,93,117,0.10)"
          stroke="#7a8399"
          stroke-width="1"
        />
        <text
          x="56"
          y="184"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          Client
        </text>
        <rect x="480" y="40" width="288" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="496"
          y="76"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          Updates API
        </text>
        <text
          x="496"
          y="104"
          text-anchor="start"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          小 JSON / multipart manifest
        </text>
        <rect x="480" y="200" width="400" height="96" rx="6" fill="#f5f5f5" />
        <rect
          x="480"
          y="200"
          width="400"
          height="96"
          rx="6"
          fill="rgba(45,49,66,0.05)"
          stroke="#4f5d75"
          stroke-width="1"
        />
        <text
          x="496"
          y="236"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          CDN
        </text>
        <text
          x="496"
          y="264"
          text-anchor="start"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          launchAsset.jsbundle / .hbc + assets
        </text>
      </svg>
    </div>
  </body>
</html>
