<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>两条发布管道</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f5f5;
        color: #2d3142;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 32px;
        font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .frame {
        width: 960px;
      }
      .eyebrow {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4f5d75;
        margin-bottom: 8px;
      }
      h1 {
        font-family: 'Instrument Serif', 'Noto Serif SC', 'PingFang SC', serif;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 24px;
      }
      svg {
        width: 960px;
        height: 328px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Architecture · Diagram Design</p>
      <h1>两条发布管道</h1>
      <svg
        width="960"
        height="328"
        viewBox="0 0 960 328"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="pipelines-title pipelines-desc"
      >
        <title id="pipelines-title">两条发布管道</title>
        <desc id="pipelines-desc">原文是两组并列内容，中间没有判断节点，也没有箭头。商店一组，OTA 一组。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
          </marker>
        </defs>
        <rect width="960" height="328" fill="#f5f5f5" />
        <rect
          x="40"
          y="40"
          width="416"
          height="248"
          rx="8"
          fill="rgba(45,49,66,0.02)"
          stroke="rgba(45,49,66,0.10)"
          stroke-width="0.8"
        />
        <rect
          x="504"
          y="40"
          width="416"
          height="248"
          rx="8"
          fill="rgba(45,49,66,0.02)"
          stroke="rgba(45,49,66,0.10)"
          stroke-width="0.8"
        />
        <rect x="56" y="56" width="180" height="20" rx="2" fill="#f5f5f5" />
        <text
          x="64"
          y="70"
          text-anchor="start"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          App Store / TestFlight
        </text>
        <rect x="520" y="56" width="176" height="20" rx="2" fill="#f5f5f5" />
        <text
          x="528"
          y="70"
          text-anchor="start"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          OTA（Updates channel）
        </text>
        <rect x="56" y="100" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="72"
          y="136"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          原生壳 + Framework +（可选）内置 jsbundle
        </text>
        <rect x="56" y="188" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="72"
          y="224"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          触发：改原生 / Bridge / Pod / runtimeVersion
        </text>
        <rect x="520" y="100" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="536"
          y="136"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          仅 JS bundle + assets
        </text>
        <rect x="520" y="188" width="384" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="536"
          y="224"
          text-anchor="start"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        >
          触发：改 mobile-rn 业务代码
        </text>
      </svg>
    </div>
  </body>
</html>
