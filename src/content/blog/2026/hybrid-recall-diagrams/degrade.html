<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>降级是一等公民</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #eb6c36;
        --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1280px;
        width: 100%;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 900px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">State machine · Diagram Design</p>
      <h1>降级是一等公民</h1>

      <svg
        viewBox="0 0 1280 720"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="hybrid-degrade-title hybrid-degrade-desc"
      >
        <title id="hybrid-degrade-title">降级是一等公民</title>
        <desc id="hybrid-degrade-desc">
          状态机：召回从开始经嵌入门控进入混检或词检索，再经融合分到达可用结果或明确 miss，重排失败可退回融合分。
        </desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5" />

        <!-- Start dot → 开始 -->
        <circle cx="60" cy="200" r="6" fill="#2d3142" />
        <line x1="66" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- 开始 → 嵌入就绪 -->
        <line x1="280" y1="200" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- 嵌入 → 混检 -->
        <line x1="520" y1="200" x2="600" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <!-- 混检 → 融合分 -->
        <line x1="760" y1="200" x2="840" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- 融合分 → 结果 -->
        <line
          x1="1000"
          y1="200"
          x2="1080"
          y2="200"
          stroke="#eb6c36"
          stroke-width="1.4"
          marker-end="url(#arrow-accent)"
        />
        <!-- 结果 → end ring -->
        <line x1="1240" y1="200" x2="1240" y2="200" stroke="none" />
        <line x1="1220" y1="200" x2="1232" y2="200" stroke="#4f5d75" stroke-width="1.2" />
        <!-- end ring after result - place at right of result -->
        <!-- Actually end after result: result right edge 1220, end at 1252 - viewBox is 1280 so squeeze -->
        <!-- Adjust: result ends at 1200, end rings at 1240 -->

        <!-- 嵌入 → 词检索 (down) -->
        <path
          d="M 440 240 V 372 Q 440 380 448 380 H 520"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- 词检索 → 融合分 -->
        <path
          d="M 680 412 H 900 Q 920 412 920 404 V 240"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- 融合分 → 重排失败 -->
        <path
          d="M 920 240 V 372 Q 920 380 928 380 H 1000"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- 重排失败 → 结果 -->
        <path
          d="M 1160 380 H 1180 Q 1200 380 1200 372 V 240"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- 融合分 → miss -->
        <path
          d="M 920 240 V 520 Q 920 528 928 528 H 1080"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />

        <!-- Labels -->
        <rect x="392" y="176" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="424"
          y="188"
          fill="#eb6c36"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          就绪
        </text>

        <rect x="408" y="300" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="440"
          y="312"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          未就绪
        </text>

        <rect x="780" y="360" width="80" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="820"
          y="372"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          继续排序
        </text>

        <rect x="888" y="300" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="920"
          y="312"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          重排挂
        </text>

        <rect x="960" y="360" width="80" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1000"
          y="372"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          退回融合分
        </text>

        <rect x="960" y="460" width="48" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="984"
          y="472"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          空集
        </text>

        <rect x="1020" y="176" width="48" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1044"
          y="188"
          fill="#eb6c36"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          有候选
        </text>

        <!-- States -->
        <!-- 开始 -->
        <rect x="120" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="200"
          y="192"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          开始召回
        </text>
        <text x="200" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          query in
        </text>

        <!-- 嵌入就绪 decision-like but state -->
        <rect x="360" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="440"
          y="192"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          嵌入就绪?
        </text>
        <text x="440" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          model gate
        </text>

        <!-- 混检 -->
        <rect x="600" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="680"
          y="192"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          词面 ∪ 向量
        </text>
        <text x="680" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          hybrid
        </text>

        <!-- 融合分 -->
        <rect x="840" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="920"
          y="192"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          融合分排序
        </text>
        <text x="920" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          0.4+0.6
        </text>

        <!-- 结果 FOCAL success -->
        <rect
          x="1080"
          y="156"
          width="140"
          height="88"
          rx="8"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <text
          x="1150"
          y="192"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          单条 / 多选
        </text>
        <text x="1150" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          usable
        </text>

        <!-- end ring -->
        <circle cx="1252" cy="200" r="8" fill="none" stroke="#2d3142" stroke-width="1.2" />
        <circle cx="1252" cy="200" r="5" fill="#2d3142" />
        <line x1="1220" y1="200" x2="1244" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- 词检索 waiting -->
        <rect
          x="520"
          y="360"
          width="160"
          height="80"
          rx="8"
          fill="rgba(45,49,66,0.02)"
          stroke="rgba(45,49,66,0.20)"
          stroke-width="1"
          stroke-dasharray="4,3"
        />
        <text
          x="600"
          y="392"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          只用词检索
        </text>
        <text x="600" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          lex fallback
        </text>

        <!-- 重排失败 -->
        <rect
          x="1000"
          y="360"
          width="160"
          height="80"
          rx="8"
          fill="rgba(235,108,54,0.05)"
          stroke="rgba(235,108,54,0.50)"
          stroke-width="1"
          stroke-dasharray="4,4"
        />
        <text
          x="1080"
          y="392"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          重排失败
        </text>
        <text x="1080" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          retryable
        </text>

        <!-- miss -->
        <rect
          x="1080"
          y="500"
          width="140"
          height="80"
          rx="8"
          fill="rgba(45,49,66,0.05)"
          stroke="#4f5d75"
          stroke-width="1"
        />
        <text
          x="1150"
          y="532"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          明确 miss
        </text>
        <text x="1150" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          terminal
        </text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">
          LEGEND
        </text>
        <circle cx="148" cy="660" r="6" fill="#2d3142" />
        <text
          x="164"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          开始
        </text>
        <circle cx="240" cy="660" r="8" fill="none" stroke="#2d3142" stroke-width="1.2" />
        <circle cx="240" cy="660" r="5" fill="#2d3142" />
        <text
          x="256"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          结束
        </text>
        <rect
          x="320"
          y="652"
          width="28"
          height="16"
          rx="4"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <text
          x="360"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          可用结果
        </text>
        <line x1="460" y1="660" x2="500" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" />
        <text
          x="512"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          降级路径
        </text>
      </svg>
    </div>
  </body>
</html>
