<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同一套混检，两种入口</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #eb6c36;
        --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1280px;
        width: 100%;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 900px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Swimlane · Diagram Design</p>
      <h1>同一套混检，两种入口</h1>

      <svg
        viewBox="0 0 1280 720"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="hybrid-entry-title hybrid-entry-desc"
      >
        <title id="hybrid-entry-title">同一套混检，两种入口</title>
        <desc id="hybrid-entry-desc">泳道图：列表即时搜索跟手优先、精准召回准优先，两条路径汇合到结果呈现。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5" />

        <!-- Lane frame -->
        <line x1="40" y1="80" x2="1240" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1" />
        <line x1="40" y1="280" x2="1240" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="1" />
        <line x1="40" y1="480" x2="1240" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="1" />
        <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" />
        <line x1="200" y1="80" x2="200" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" />

        <!-- Phase headers -->
        <text
          x="360"
          y="60"
          fill="#7a8399"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          入口
        </text>
        <text
          x="640"
          y="60"
          fill="#7a8399"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          是否等嵌入
        </text>
        <text
          x="920"
          y="60"
          fill="#7a8399"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          是否重排
        </text>
        <text
          x="1140"
          y="60"
          fill="#7a8399"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          结果
        </text>

        <!-- Lane labels (CJK sans 12px) -->
        <text
          x="120"
          y="180"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          列表搜索
        </text>
        <text x="120" y="200" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          FAST
        </text>
        <text
          x="120"
          y="380"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          精准召回
        </text>
        <text x="120" y="400" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          PRECISE
        </text>
        <text
          x="120"
          y="540"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          用户感知
        </text>
        <text x="120" y="560" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          UX
        </text>

        <!-- Connectors -->
        <!-- list: entry → embed → rank -->
        <line
          x1="440"
          y1="180"
          x2="520"
          y2="180"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <line
          x1="720"
          y1="180"
          x2="800"
          y2="180"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- list → ux -->
        <path
          d="M 1000 212 V 452 Q 1000 460 1008 460 H 1060"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- precise: entry → embed → rank -->
        <line x1="440" y1="380" x2="520" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <line x1="720" y1="380" x2="800" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <!-- precise → ux -->
        <path
          d="M 1000 412 V 500 Q 1000 508 1008 508 H 1060"
          fill="none"
          stroke="#eb6c36"
          stroke-width="1.4"
          marker-end="url(#arrow-accent)"
        />

        <!-- labels -->
        <rect x="1008" y="320" width="48" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1032"
          y="332"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          跟手
        </text>
        <rect x="1008" y="448" width="56" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1036"
          y="460"
          fill="#eb6c36"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          优先准
        </text>

        <!-- List nodes -->
        <rect x="280" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="360"
          y="172"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          输入框搜索
        </text>
        <text x="360" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          keystroke
        </text>

        <rect x="560" y="140" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="640"
          y="172"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          嵌入未就绪
        </text>
        <text x="640" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          lex only
        </text>

        <rect
          x="840"
          y="140"
          width="160"
          height="80"
          rx="6"
          fill="rgba(45,49,66,0.05)"
          stroke="#4f5d75"
          stroke-width="1"
        />
        <text
          x="920"
          y="172"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          无 LLM 重排
        </text>
        <text x="920" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          fusion score
        </text>

        <!-- Precise nodes -->
        <rect x="280" y="340" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="360"
          y="372"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          精准找一条
        </text>
        <text x="360" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          can wait
        </text>

        <rect x="560" y="340" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="640"
          y="372"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          等嵌入就绪
        </text>
        <text x="640" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          e5 warm
        </text>

        <rect
          x="840"
          y="336"
          width="160"
          height="88"
          rx="6"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <rect
          x="848"
          y="344"
          width="36"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(235,108,54,0.50)"
          stroke-width="0.8"
        />
        <text
          x="866"
          y="353"
          fill="#eb6c36"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          LLM
        </text>
        <text
          x="920"
          y="380"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          有 LLM 重排
        </text>
        <text x="920" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          small set
        </text>

        <!-- UX result -->
        <rect
          x="1060"
          y="500"
          width="160"
          height="80"
          rx="6"
          fill="rgba(45,49,66,0.03)"
          stroke="rgba(45,49,66,0.30)"
          stroke-width="1"
        />
        <text
          x="1140"
          y="532"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          结果呈现
        </text>
        <text x="1140" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          fast or accurate
        </text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">
          LEGEND
        </text>
        <line x1="140" y1="660" x2="180" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" />
        <text
          x="192"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          列表 · 跟手
        </text>
        <line x1="340" y1="660" x2="380" y2="660" stroke="#eb6c36" stroke-width="1.4" />
        <text
          x="392"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          精准 · 优先准
        </text>
        <rect
          x="560"
          y="652"
          width="28"
          height="16"
          rx="4"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <text
          x="600"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          焦点步骤
        </text>
      </svg>
    </div>
  </body>
</html>
