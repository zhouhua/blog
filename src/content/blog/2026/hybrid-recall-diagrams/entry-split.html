<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同一套混检，两种入口</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #eb6c36;
        --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1200px;
        width: 100%;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Swimlane · Diagram Design</p>
      <h1>同一套混检，两种入口</h1>

      <svg
        viewBox="0 0 1000 440"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="entry-title entry-desc"
      >
        <title id="entry-title">同一套混检，两种入口</title>
        <desc id="entry-desc">
          泳道图对比列表即时搜索与精准召回：前者不等嵌入、不重排；后者等嵌入并走 LLM 重排，最终汇合到结果呈现。
        </desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5" />

        <!-- Lane bands -->
        <rect x="160" y="64" width="800" height="96" fill="rgba(45,49,66,0.018)" />
        <line x1="40" y1="64" x2="960" y2="64" stroke="rgba(45,49,66,0.22)" stroke-width="1" />
        <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(45,49,66,0.10)" stroke-width="1" />
        <line x1="40" y1="256" x2="960" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="1" />
        <line x1="40" y1="352" x2="960" y2="352" stroke="rgba(45,49,66,0.22)" stroke-width="1" />
        <line x1="160" y1="64" x2="160" y2="352" stroke="rgba(45,49,66,0.22)" stroke-width="1" />

        <!-- Lane labels (CN 12px) -->
        <text
          x="100"
          y="116"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          列表搜索
        </text>
        <text
          x="100"
          y="212"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          精准召回
        </text>
        <text
          x="100"
          y="308"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          用户感知
        </text>

        <!-- Connectors (orthogonal only) -->
        <!-- list: a→b→c -->
        <line
          x1="320"
          y1="112"
          x2="360"
          y2="112"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="4,3"
          marker-end="url(#arrow)"
        />
        <line
          x1="520"
          y1="112"
          x2="560"
          y2="112"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="4,3"
          marker-end="url(#arrow)"
        />
        <!-- list → result (top attach @ 680) -->
        <path
          d="M 720,112 H 680 Q 680,112 680,120 V 276"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="4,3"
          marker-end="url(#arrow)"
        />
        <!-- precise: d→e→f -->
        <line x1="320" y1="208" x2="360" y2="208" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <line x1="520" y1="208" x2="560" y2="208" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <!-- precise → result (top attach @ 760) -->
        <path
          d="M 720,208 H 760 Q 760,208 760,216 V 276"
          fill="none"
          stroke="#eb6c36"
          stroke-width="1.4"
          marker-end="url(#arrow-accent)"
        />

        <!-- Labels -->
        <rect x="692" y="176" width="40" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="712"
          y="188"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          跟手
        </text>

        <rect x="772" y="220" width="52" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="798"
          y="232"
          fill="#eb6c36"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          优先准
        </text>

        <!-- List lane nodes -->
        <rect x="200" y="88" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="260"
          y="110"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          输入框搜索
        </text>
        <text x="260" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          keydown
        </text>

        <rect x="360" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="440"
          y="110"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          嵌入未就绪
        </text>
        <text x="440" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          lex only
        </text>

        <rect x="560" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="640"
          y="110"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          无 LLM 重排
        </text>
        <text x="640" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          fusion score
        </text>

        <!-- Precise lane nodes -->
        <rect x="200" y="184" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="260"
          y="206"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          精准找一条
        </text>
        <text x="260" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          can wait
        </text>

        <rect x="360" y="184" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="440"
          y="206"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          等嵌入就绪
        </text>
        <text x="440" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          e5 warm
        </text>

        <rect x="560" y="184" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="640"
          y="206"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          有 LLM 重排
        </text>
        <text x="640" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          disambiguate
        </text>

        <!-- Result focal -->
        <rect
          x="640"
          y="276"
          width="160"
          height="56"
          rx="6"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1"
        />
        <text
          x="720"
          y="300"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          结果呈现
        </text>
        <text x="720" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          fast or accurate
        </text>

        <!-- Legend -->
        <line x1="40" y1="380" x2="960" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <text
          x="40"
          y="404"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          图例
        </text>
        <line
          x1="100"
          y1="400"
          x2="132"
          y2="400"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="4,3"
          marker-end="url(#arrow)"
        />
        <text
          x="140"
          y="404"
          fill="#4f5d75"
          font-size="12"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          列表 · 跟手
        </text>
        <line x1="280" y1="400" x2="312" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <text
          x="320"
          y="404"
          fill="#4f5d75"
          font-size="12"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          精准 · 优先准
        </text>
        <rect
          x="460"
          y="392"
          width="14"
          height="10"
          rx="2"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1"
        />
        <text
          x="484"
          y="404"
          fill="#4f5d75"
          font-size="12"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          汇合结果
        </text>
      </svg>
    </div>
  </body>
</html>
