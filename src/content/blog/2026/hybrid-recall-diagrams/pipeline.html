<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客户端混合召回主链路</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #eb6c36;
        --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1280px;
        width: 100%;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 900px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Flowchart · Diagram Design</p>
      <h1>客户端混合召回主链路</h1>

      <svg
        viewBox="0 0 1280 720"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="hybrid-pipeline-title hybrid-pipeline-desc"
      >
        <title id="hybrid-pipeline-title">客户端混合召回主链路</title>
        <desc id="hybrid-pipeline-desc">
          流程图：用户查询经检索针与词向量混检得到 top K，再按是否重排定夺为单条命中、多选或 miss。
        </desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5" />

        <!-- Connectors first -->
        <!-- query → needle -->
        <line x1="180" y1="120" x2="280" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- needle → hybrid -->
        <line x1="420" y1="120" x2="520" y2="120" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <!-- hybrid → topk -->
        <line x1="660" y1="120" x2="760" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- topk → diamond (down) -->
        <line x1="840" y1="152" x2="840" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- diamond → llm (right) -->
        <line
          x1="888"
          y1="268"
          x2="980"
          y2="268"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- diamond → merge (down) no-rerank -->
        <line x1="840" y1="316" x2="840" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- llm → merge elbow down-left -->
        <path
          d="M 1060 300 V 372 Q 1060 380 1052 380 H 900"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- merge → decide -->
        <line x1="840" y1="388" x2="840" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <!-- decide → result (down) -->
        <line x1="840" y1="500" x2="840" y2="540" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
        <!-- decide → miss (right-down elbow) -->
        <path
          d="M 900 468 H 1052 Q 1060 468 1060 476 V 540"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1.2"
          stroke-dasharray="5,4"
          marker-end="url(#arrow)"
        />
        <!-- topk empty → miss (side branch) -->
        <path
          d="M 900 120 H 1120 Q 1128 120 1128 128 V 540"
          fill="none"
          stroke="#4f5d75"
          stroke-width="1"
          stroke-dasharray="4,3"
          marker-end="url(#arrow)"
        />

        <!-- Arrow labels (CJK 12px sans) -->
        <rect x="808" y="176" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="840"
          y="188"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          候选
        </text>

        <rect x="900" y="248" width="56" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="928"
          y="260"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          是
        </text>

        <rect x="808" y="336" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="840"
          y="348"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          否
        </text>

        <rect x="808" y="508" width="64" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="840"
          y="520"
          fill="#eb6c36"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          有候选
        </text>

        <rect x="980" y="488" width="48" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1004"
          y="500"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          空
        </text>

        <rect x="1136" y="300" width="56" height="16" rx="2" fill="#f5f5f5" />
        <text
          x="1164"
          y="312"
          fill="#7a8399"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          空集
        </text>

        <!-- Nodes -->
        <!-- 1 query start oval -->
        <rect x="40" y="88" width="140" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="110"
          y="116"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          用户查询
        </text>
        <text x="110" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          NL query
        </text>

        <!-- 2 needle -->
        <rect x="280" y="88" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect
          x="288"
          y="96"
          width="36"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(45,49,66,0.40)"
          stroke-width="0.8"
        />
        <text
          x="306"
          y="105"
          fill="rgba(45,49,66,0.8)"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          STEP
        </text>
        <text
          x="350"
          y="124"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          抽出检索针
        </text>
        <text x="350" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          keywords
        </text>

        <!-- 3 hybrid FOCAL -->
        <rect
          x="520"
          y="84"
          width="140"
          height="72"
          rx="6"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <rect
          x="528"
          y="92"
          width="44"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(235,108,54,0.50)"
          stroke-width="0.8"
        />
        <text
          x="550"
          y="101"
          fill="#eb6c36"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          HYBRID
        </text>
        <text
          x="590"
          y="124"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          词面 ∪ 向量
        </text>
        <text x="590" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          hybridRetrieve
        </text>

        <!-- 4 topk store -->
        <rect
          x="760"
          y="88"
          width="160"
          height="64"
          rx="6"
          fill="rgba(45,49,66,0.05)"
          stroke="#4f5d75"
          stroke-width="1"
        />
        <rect
          x="768"
          y="96"
          width="40"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(79,93,117,0.40)"
          stroke-width="0.8"
        />
        <text
          x="788"
          y="105"
          fill="rgba(79,93,117,0.8)"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          TOP-K
        </text>
        <text
          x="840"
          y="124"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          top K 候选
        </text>
        <text x="840" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          e.g. 16
        </text>

        <!-- 5 diamond -->
        <path d="M 840 220 L 888 268 L 840 316 L 792 268 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="840"
          y="264"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          要重排?
        </text>
        <text x="840" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          precise?
        </text>

        <!-- 6 llm optional -->
        <rect
          x="980"
          y="236"
          width="160"
          height="64"
          rx="6"
          fill="rgba(45,49,66,0.02)"
          stroke="rgba(45,49,66,0.20)"
          stroke-width="1"
          stroke-dasharray="4,3"
        />
        <rect
          x="988"
          y="244"
          width="36"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(45,49,66,0.30)"
          stroke-width="0.8"
        />
        <text
          x="1006"
          y="253"
          fill="rgba(45,49,66,0.7)"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          LLM
        </text>
        <text
          x="1060"
          y="272"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          短重排
        </text>
        <text x="1060" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          optional
        </text>

        <!-- merge dot -->
        <circle cx="840" cy="388" r="4" fill="#2d3142" />

        <!-- 7 decide -->
        <rect x="760" y="420" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect
          x="768"
          y="428"
          width="48"
          height="12"
          rx="2"
          fill="transparent"
          stroke="rgba(45,49,66,0.40)"
          stroke-width="0.8"
        />
        <text
          x="792"
          y="437"
          fill="rgba(45,49,66,0.8)"
          font-size="7"
          font-family="'Geist Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.08em"
        >
          DECIDE
        </text>
        <text
          x="840"
          y="460"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          置信度 / 分差
        </text>
        <text x="840" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          single / multi
        </text>

        <!-- 8 result end -->
        <rect
          x="760"
          y="540"
          width="160"
          height="64"
          rx="20"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <text
          x="840"
          y="568"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          单条 / 多选
        </text>
        <text x="840" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          to UI
        </text>

        <!-- 9 miss end -->
        <rect
          x="980"
          y="540"
          width="160"
          height="64"
          rx="20"
          fill="rgba(45,49,66,0.03)"
          stroke="rgba(45,49,66,0.30)"
          stroke-width="1"
          stroke-dasharray="4,3"
        />
        <text
          x="1060"
          y="568"
          fill="#2d3142"
          font-size="12"
          font-weight="600"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
          text-anchor="middle"
        >
          miss
        </text>
        <text x="1060" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">
          empty
        </text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" />
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">
          LEGEND
        </text>
        <rect x="140" y="652" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="180"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          起止
        </text>
        <rect x="240" y="652" width="28" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="280"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          步骤
        </text>
        <path d="M 360 660 L 376 648 L 392 660 L 376 672 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <text
          x="404"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          判断
        </text>
        <rect
          x="480"
          y="652"
          width="28"
          height="16"
          rx="4"
          fill="rgba(235,108,54,0.08)"
          stroke="#eb6c36"
          stroke-width="1.2"
        />
        <text
          x="520"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          焦点
        </text>
        <line x1="600" y1="660" x2="640" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" />
        <text
          x="652"
          y="664"
          fill="#4f5d75"
          font-size="12"
          font-weight="500"
          font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif"
        >
          可选 / 降级
        </text>
      </svg>
    </div>
  </body>
</html>
